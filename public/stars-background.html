<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stars Background</title>
<style>
  /* Cấu hình toàn màn hình không thanh cuộn */
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  /* Khung chứa bầu trời sao với dải chuyển màu radial */
  .container {
    --star-color: #0f172a;
    position: relative;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at bottom, #dbeafe 0%, #f1f5f9 55%, #ffffff 100%);
  }

  /* Định dạng chung 3 lớp sao */
  #stars, #stars2, #stars3 {
    background: transparent;
  }

  /* Lớp 1: 700 sao nhỏ 1px, cuộn 50s */
  #stars {
    width: 1px;
    height: 1px;
    box-shadow: var(--s1);
    opacity: 0.45;
    animation: animStar 50s linear infinite;
  }

  /* Lớp 2: 200 sao vừa 2px, cuộn 100s */
  #stars2 {
    width: 2px;
    height: 2px;
    box-shadow: var(--s2);
    opacity: 0.65;
    animation: animStar 100s linear infinite;
  }

  /* Lớp 3: 100 sao lớn 3px, cuộn 150s */
  #stars3 {
    width: 3px;
    height: 3px;
    box-shadow: var(--s3);
    opacity: 0.85;
    animation: animStar 150s linear infinite;
  }

  /* Pseudo-element nhân bản lớp sao ở vị trí top: 2000px để vòng lặp liền mạch */
  #stars:after, #stars2:after, #stars3:after {
    content: " ";
    position: absolute;
    top: 2000px;
    background: transparent;
  }

  #stars:after {
    width: 1px;
    height: 1px;
    box-shadow: var(--s1);
  }

  #stars2:after {
    width: 2px;
    height: 2px;
    box-shadow: var(--s2);
  }

  #stars3:after {
    width: 3px;
    height: 3px;
    box-shadow: var(--s3);
  }

  /* Hiệu ứng bay liên tục từ dưới lên trên */
  @keyframes animStar {
    from {
      transform: translateY(0);
    }
    to {
      transform: translateY(-2000px);
    }
  }
</style>
</head>
<body>
<div class="container" id="root">
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>
</div>
<script>
  // Hàm sinh toạ độ sao ngẫu nhiên trong toạ độ 2000x2000 gán cho box-shadow
  function shadows(n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push(Math.floor(Math.random() * 2000) + "px " +
               Math.floor(Math.random() * 2000) + "px var(--star-color)");
    }
    return out.join(",");
  }

  // Khởi tạo và gán toạ độ sao vào các biến CSS
  var root = document.getElementById("root");
  root.style.setProperty("--s1", shadows(700));
  root.style.setProperty("--s2", shadows(200));
  root.style.setProperty("--s3", shadows(100));
</script>
</body>
</html>
